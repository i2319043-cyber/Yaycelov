name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            ballistics/build/outputs/apk/debug/ballistics-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Yaycelov.apk
          cp ballistics/build/outputs/apk/debug/ballistics-debug.apk Ballistics.apk
          gh release create v1.1-${{ github.run_number }} Yaycelov.apk Ballistics.apk --title "APK: Яйцелов и Баллистика" --notes "Отладочные APK"
